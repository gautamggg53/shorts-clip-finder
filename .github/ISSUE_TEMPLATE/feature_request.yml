name: Feature request
description: Suggest a new scoring signal, export format or option
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: For scoring changes, include example sentences that should score higher or lower.
